[package]
name = "mcp-absorb"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP stdio proxy that wraps a subordinate MCP server and adds tttt inject loops (poll a tool, inject fresh output into the tttt session input)"
repository = "https://github.com/ayourtch-llm/mcp-absorb"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
